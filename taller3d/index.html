<title>Taller 3D</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: herramientas arriba, figuras a la izquierda, mesa 3D al centro, medidas a la derecha (en móvil se apilan) */
:root{
  --bg:#eef1f5; --panel:#ffffff; --panel-2:#f5f7fa; --line:#d5dbe4; --fg:#18202b; --muted:#5b6778;
  --accent:#1f5fd1; --accent-ink:#ffffff; --accent-soft:#e3ecfb; --hole:#7a8494; --danger:#b42318;
  --scene:#e9edf3; --grid-major:#9aa6b6; --grid-minor:#cfd6e0;
  --f-ui:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-display:"Bricolage Grotesque","Atkinson Hyperlegible",system-ui,sans-serif;
  --f-num:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12161d; --panel:#1a2029; --panel-2:#212835; --line:#2f3847; --fg:#e7ecf3; --muted:#9aa6b8;
  --accent:#6b9cff; --accent-ink:#0d1420; --accent-soft:#1e2c47; --hole:#8d97a8; --danger:#ff8a80;
  --scene:#161b23; --grid-major:#4a5568; --grid-minor:#2a323f; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12161d; --panel:#1a2029; --panel-2:#212835; --line:#2f3847; --fg:#e7ecf3; --muted:#9aa6b8;
  --accent:#6b9cff; --accent-ink:#0d1420; --accent-soft:#1e2c47; --hole:#8d97a8; --danger:#ff8a80;
  --scene:#161b23; --grid-major:#4a5568; --grid-minor:#2a323f; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-ui);font-size:14px;overflow:hidden}
*{box-sizing:border-box}
button,input,select{font:inherit;color:inherit}
.app{height:100%;display:grid;grid-template-columns:150px minmax(0,1fr) 260px;grid-template-rows:auto minmax(0,1fr);
  padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
header{grid-column:1/-1;display:flex;align-items:center;gap:5px;flex-wrap:wrap;padding:8px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px));
  background:var(--panel);border-bottom:1px solid var(--line)}
.brand{font-family:var(--f-display);font-size:19px;letter-spacing:-.01em;margin-right:6px;display:flex;align-items:center;gap:8px;white-space:nowrap}
.brand i{width:18px;height:18px;border:2px solid var(--accent);border-radius:3px;display:inline-block;position:relative;transform:rotate(-8deg)}
.brand i::after{content:"";position:absolute;inset:3px;border:2px dashed var(--hole);border-radius:50%}
.sep{width:1px;height:24px;background:var(--line);margin:0 2px}
.btn{border:1px solid var(--line);background:var(--panel-2);padding:6px 9px;border-radius:6px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;line-height:1.2}
.btn:hover{border-color:var(--accent)}
.btn:focus-visible,.shape:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.btn:disabled{opacity:.45;cursor:default;border-color:var(--line)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
.btn.on{background:var(--accent-soft);border-color:var(--accent);color:var(--fg)}
.seg{display:inline-flex}.seg .btn{border-radius:0}.seg .btn:first-child{border-radius:6px 0 0 6px}.seg .btn:last-child{border-radius:0 6px 6px 0}.seg .btn+.btn{border-left:none}
kbd{font-family:var(--f-num);font-size:10px;color:var(--muted)}
.spacer{flex:1}
header .btn{font-size:13px;padding:6px 8px}
@media (max-width:1300px) and (min-width:761px){ header .brand{font-size:0;gap:0;margin-right:2px} }
select.btn{padding-right:6px}
aside{background:var(--panel);overflow:auto;min-height:0}
.shapes{border-right:1px solid var(--line);padding:12px 10px;display:flex;flex-direction:column;gap:6px}
.label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700;margin:4px 2px}
.shape{display:flex;align-items:center;gap:10px;padding:7px 8px;border:1px solid transparent;border-radius:8px;background:none;cursor:pointer;text-align:left;width:100%}
.shape:hover{background:var(--panel-2);border-color:var(--line)}
.shape svg{width:30px;height:30px;flex:none}
.shape svg *{fill:none;stroke:var(--fg);stroke-width:1.6;stroke-linejoin:round}
.shape.holeshape svg *{stroke:var(--hole);stroke-dasharray:3 2}
.viewport{position:relative;min-width:0;min-height:0;background:var(--scene)}
#c{display:block;width:100%;height:100%;touch-action:none}
.hud{position:absolute;left:12px;bottom:12px;display:flex;gap:6px;flex-wrap:wrap}
.hud .btn{background:var(--panel)}
.hint{position:absolute;left:12px;top:12px;right:12px;pointer-events:none;color:var(--muted);font-size:13px;max-width:52ch}
.toast{position:absolute;left:50%;top:14px;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90%;text-align:center}
.toast.show{opacity:1}
.loading{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);text-align:center;padding:16px;line-height:1.5}
.props{border-left:1px solid var(--line);padding:12px 14px;display:flex;flex-direction:column;gap:12px}
.props h2{font-family:var(--f-display);font-size:17px;margin:0;text-wrap:balance}
.empty{color:var(--muted);line-height:1.5}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.field{display:flex;flex-direction:column;gap:3px;min-width:0}
.field span{font-size:11px;color:var(--muted)}
.field input,.field select{width:100%;min-width:0;padding:5px 6px;border:1px solid var(--line);border-radius:5px;background:var(--panel-2);font-family:var(--f-num);font-size:13px;font-variant-numeric:tabular-nums}
.field input[type=color]{padding:2px;height:32px}
.field input[type=text]{font-family:var(--f-ui)}
.axis-x{color:#d64545}.axis-y{color:#2f9e44}.axis-z{color:var(--accent)}
.toggle{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.toggle button{border:none;background:var(--panel-2);padding:8px;cursor:pointer}
.toggle button.on{background:var(--accent);color:var(--accent-ink);font-weight:700}
.toggle button.on.h{background:var(--hole);color:#fff}
.row{display:flex;gap:6px;flex-wrap:wrap}
.btn.danger{color:var(--danger)}
.check{display:flex;gap:8px;align-items:center;cursor:pointer}
.note{font-size:12px;color:var(--muted);line-height:1.45}
.units{font-family:var(--f-num);font-size:11px;color:var(--muted)}
@media (max-width:760px){
  body{overflow:auto}
  .app{grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto 58vh auto;height:auto;min-height:100%}
  .shapes{flex-direction:row;overflow-x:auto;border-right:none;border-bottom:1px solid var(--line);padding:8px 16px}
  .shapes .label,.shapes .note{display:none}
  .shape{width:auto;flex:none;flex-direction:column;gap:2px;font-size:11px;padding:6px}
  .props{border-left:none;border-top:1px solid var(--line);padding:14px max(16px,env(safe-area-inset-right,0px)) 14px max(16px,env(safe-area-inset-left,0px))}
  kbd,.sep{display:none}
}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>

<div class="app">
  <header>
    <div class="brand"><i></i>Taller 3D</div>
    <button class="btn" id="bNew" title="Empezar un diseño nuevo">Nuevo</button>
    <button class="btn" id="bOpen" title="Abrir un proyecto guardado (.json)">Abrir</button>
    <button class="btn" id="bSave" title="Guardar el proyecto (.json)">Guardar</button>
    <input type="file" id="fileOpen" accept=".json,application/json" hidden>
    <span class="sep"></span>
    <button class="btn" id="bUndo" title="Deshacer (Ctrl+Z)">↶ Deshacer</button>
    <button class="btn" id="bRedo" title="Rehacer (Ctrl+Y)">↷ Rehacer</button>
    <button class="btn" id="bDup" title="Duplicar la selección (Ctrl+D)">Duplicar</button>
    <span class="sep"></span>
    <div class="seg" role="group" aria-label="Herramienta">
      <button class="btn on" data-mode="translate" title="Mover (W)">Mover</button>
      <button class="btn" data-mode="rotate" title="Rotar (E)">Rotar</button>
      <button class="btn" data-mode="scale" title="Escalar (R)">Escalar</button>
    </div>
    <select class="btn" id="snap" title="Ajuste a la cuadrícula: cuánto avanza la figura al moverla o cambiar su tamaño">
      <option value="0">Ajuste: libre</option><option value="0.5">Ajuste: 0,5 mm</option><option value="1" selected>Ajuste: 1 mm</option><option value="5">Ajuste: 5 mm</option><option value="10">Ajuste: 10 mm</option>
    </select>
    <span class="sep"></span>
    <button class="btn" id="bGroup" title="Agrupar: une las figuras sólidas y resta los huecos. Sin selección, agrupa todo (Ctrl+G)">Agrupar</button>
    <button class="btn" id="bUngroup" title="Separar un grupo en sus figuras (Ctrl+Shift+G)">Desagrupar</button>
    <span class="spacer"></span>
    <button class="btn primary" id="bStl" title="Descargar en formato STL para imprimir (todo el diseño, o solo lo seleccionado)">Exportar STL</button>
  </header>

  <aside class="shapes" aria-label="Figuras">
    <div class="label">Sólidos</div>
    <button class="shape" data-add="caja"><svg viewBox="0 0 32 32"><path d="M6 11l10-5 10 5v11l-10 5-10-5z"/><path d="M6 11l10 5 10-5M16 16v11"/></svg>Caja</button>
    <button class="shape" data-add="cilindro"><svg viewBox="0 0 32 32"><ellipse cx="16" cy="8" rx="9" ry="3.5"/><path d="M7 8v16c0 2 4 3.5 9 3.5s9-1.5 9-3.5V8"/></svg>Cilindro</button>
    <button class="shape" data-add="esfera"><svg viewBox="0 0 32 32"><circle cx="16" cy="16" r="10"/><ellipse cx="16" cy="16" rx="10" ry="3.5"/></svg>Esfera</button>
    <button class="shape" data-add="cono"><svg viewBox="0 0 32 32"><path d="M16 4L7 24c0 2 4 3.5 9 3.5s9-1.5 9-3.5z"/></svg>Cono</button>
    <button class="shape" data-add="piramide"><svg viewBox="0 0 32 32"><path d="M16 4L5 21l9 6 13-5z"/><path d="M16 4l-2 23"/></svg>Pirámide</button>
    <button class="shape" data-add="prisma"><svg viewBox="0 0 32 32"><path d="M9 6h14l4 4-4 4H9l-4-4z"/><path d="M5 10v13l4 4h14l4-4V10M9 14v13M23 14v13"/></svg>Hexágono</button>
    <button class="shape" data-add="cuna"><svg viewBox="0 0 32 32"><path d="M4 24h17l7-5H11z"/><path d="M4 24l7-14 10 14M11 10l17 9"/></svg>Techo</button>
    <div class="label" style="margin-top:8px">Huecos</div>
    <button class="shape holeshape" data-add="caja" data-hole="1"><svg viewBox="0 0 32 32"><path d="M6 11l10-5 10 5v11l-10 5-10-5z"/><path d="M6 11l10 5 10-5M16 16v11"/></svg>Caja hueca</button>
    <button class="shape holeshape" data-add="cilindro" data-hole="1"><svg viewBox="0 0 32 32"><ellipse cx="16" cy="8" rx="9" ry="3.5"/><path d="M7 8v16c0 2 4 3.5 9 3.5s9-1.5 9-3.5V8"/></svg>Cilindro hueco</button>
    <p class="note">Pon un hueco dentro de un sólido y pulsa <b>Agrupar</b>: queda el agujero.</p>
  </aside>

  <main class="viewport" id="vp">
    <canvas id="c" aria-label="Mesa de trabajo 3D"></canvas>
    <div class="loading" id="loading">Cargando la mesa de trabajo…</div>
    <div class="hint" id="hint"></div>
    <div class="hud">
      <button class="btn" id="vHome" title="Vista general">Vista general</button>
      <button class="btn" id="vTop" title="Vista desde arriba">Arriba</button>
      <button class="btn" id="vFront" title="Vista de frente">Frente</button>
    </div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </main>

  <aside class="props" id="props" aria-label="Propiedades"></aside>
</div>

<script type="importmap">
{"imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
  "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/",
  "manifold-3d":"https://cdn.jsdelivr.net/npm/manifold-3d@3.2.1/manifold.js"
}}
</script>
<script>
// si las librerías 3D no cargan (sin internet o bloqueadas), avisar en vez de quedar "cargando" para siempre
setTimeout(()=>{ const l=document.getElementById('loading'); if(l && !l.hidden) l.textContent='Está tardando más de lo normal… Si no carga, revisa la conexión a internet y recarga la página.'; }, 15000);
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { TransformControls } from 'three/addons/controls/TransformControls.js';
import { mergeVertices, toCreasedNormals } from 'three/addons/utils/BufferGeometryUtils.js';
// Manifold hace las uniones y restas, y siempre entrega piezas cerradas ("manifold"), que es lo que pide la impresora
import ManifoldModule from 'manifold-3d';
const wasm = await ManifoldModule(); wasm.setup();
const { Manifold, Mesh: MMesh } = wasm;

const $ = s => document.querySelector(s);
const NAMES = {caja:'Caja',cilindro:'Cilindro',esfera:'Esfera',cono:'Cono',piramide:'Pirámide',prisma:'Hexágono',cuna:'Techo',group:'Grupo'};
const ROUND = new Set(['cilindro','esfera','cono']);
const PALETTE = ['#e8590c','#1f9d55','#1f5fd1','#c2255c','#f2b705','#7048e8','#0c8599'];
const r2 = v => Math.round(v*100)/100;

/* ---------- Estado ---------- */
let objects = [];      // figuras de primer nivel
let nextId = 1;
let selected = [];     // ids
let undoStack = [], redoStack = [];
const snapshot = () => JSON.stringify({objects, nextId});
function restore(s){ const d = JSON.parse(s); objects = d.objects; nextId = d.nextId; selected = selected.filter(id=>objects.some(o=>o.id===id)); rebuild(); }
function commit(fn){ undoStack.push(snapshot()); if(undoStack.length>100) undoStack.shift(); redoStack=[]; fn&&fn(); rebuild(); autosave(); }
function undo(){ if(!undoStack.length) return; redoStack.push(snapshot()); restore(undoStack.pop()); autosave(); }
function redo(){ if(!redoStack.length) return; undoStack.push(snapshot()); restore(redoStack.pop()); autosave(); }
function autosave(){ try{ localStorage.setItem('taller3d-proyecto', snapshot()); }catch(e){} }
const byId = id => objects.find(o=>o.id===id);

/* ---------- Escena ---------- */
const canvas = $('#c'), vp = $('#vp');
const renderer = new THREE.WebGLRenderer({canvas, antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
const scene = new THREE.Scene();
THREE.Object3D.DEFAULT_UP.set(0,0,1);
const camera = new THREE.PerspectiveCamera(40,1,0.5,5000);
camera.up.set(0,0,1);
const orbit = new OrbitControls(camera, canvas);
orbit.enableDamping = true;
scene.add(new THREE.HemisphereLight(0xffffff,0x8090a0,1.6));
const sun = new THREE.DirectionalLight(0xffffff,1.8); sun.position.set(80,-120,200); scene.add(sun);
const fill = new THREE.DirectionalLight(0xffffff,0.5); fill.position.set(-100,80,60); scene.add(fill);

const BED = 200;
let gridMinor, gridMajor;
const plane = new THREE.Mesh(new THREE.PlaneGeometry(BED*4,BED*4), new THREE.MeshBasicMaterial({visible:false}));
scene.add(plane);
const axes = new THREE.Group(); scene.add(axes);
function css(v){ return getComputedStyle(document.documentElement).getPropertyValue(v).trim(); }
function applyTheme(){
  scene.background = new THREE.Color(css('--scene'));
  [gridMinor,gridMajor].forEach(g=>{ if(g){scene.remove(g); g.geometry.dispose();} });
  gridMinor = new THREE.GridHelper(BED, BED/5, css('--grid-minor'), css('--grid-minor'));
  gridMajor = new THREE.GridHelper(BED, BED/10, css('--grid-major'), css('--grid-major'));
  for(const g of [gridMinor,gridMajor]){ g.rotation.x = Math.PI/2; scene.add(g); }
  gridMajor.position.z = 0.02;
}
axes.add(new THREE.ArrowHelper(new THREE.Vector3(1,0,0), new THREE.Vector3(-BED/2,-BED/2,0.05), 24, 0xd64545, 5, 3));
axes.add(new THREE.ArrowHelper(new THREE.Vector3(0,1,0), new THREE.Vector3(-BED/2,-BED/2,0.05), 24, 0x2f9e44, 5, 3));
axes.add(new THREE.ArrowHelper(new THREE.Vector3(0,0,1), new THREE.Vector3(-BED/2,-BED/2,0.05), 24, 0x1f5fd1, 5, 3));
applyTheme();
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyTheme);
new MutationObserver(applyTheme).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});

/* ---------- Geometrías ---------- */
function prep(g){ g = g.index ? g.toNonIndexed() : g; g.clearGroups(); g.deleteAttribute('uv'); return g; }
const unitCache = {};
function unitGeom(type, seg){
  const k = type+'|'+seg; if(unitCache[k]) return unitCache[k];
  let g;
  const X = g => g.rotateX(Math.PI/2);
  switch(type){
    case 'caja': g = new THREE.BoxGeometry(1,1,1); break;
    case 'cilindro': g = X(new THREE.CylinderGeometry(0.5,0.5,1,seg)); break;
    case 'cono': g = X(new THREE.CylinderGeometry(0.0005,0.5,1,seg)); break;
    case 'esfera': g = new THREE.SphereGeometry(0.5,seg,Math.max(6,Math.round(seg/2))); g.rotateX(Math.PI/2); break;
    case 'piramide': g = X(new THREE.CylinderGeometry(0.0005,Math.SQRT1_2,1,4).rotateY(Math.PI/4)); break;
    case 'prisma': g = X(new THREE.CylinderGeometry(0.5,0.5,1,6)); g.scale(1/Math.cos(Math.PI/6),1,1); break;
    case 'cuna': { const s = new THREE.Shape(); s.moveTo(-0.5,-0.5); s.lineTo(0.5,-0.5); s.lineTo(0,0.5); s.closePath();
      g = new THREE.ExtrudeGeometry(s,{depth:1,bevelEnabled:false}); g.translate(0,0,-0.5); g.rotateX(Math.PI/2); break; }
  }
  g = prep(g);
  if(!ROUND.has(type)) g = flatten(g);
  return unitCache[k] = g;
}
// normales planas para figuras con caras planas, suaves para las redondas
function flatten(g){ g = g.clone(); g.deleteAttribute('normal'); g.computeVertexNormals(); return g; }

// three.js -> Manifold (figuras base, en tamaño 1×1×1)
function toManifold(g){
  const ig = g.clone(); ig.deleteAttribute('normal');
  const mg = mergeVertices(ig, 1e-6);
  const mesh = new MMesh({numProp:3, vertProperties:new Float32Array(mg.attributes.position.array), triVerts:new Uint32Array(mg.index.array)});
  mesh.merge();
  return new Manifold(mesh);
}
// Manifold -> three.js (para dibujar el grupo en pantalla)
function fromManifold(man){
  const mesh = man.getMesh();
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(new Float32Array(mesh.vertProperties.slice(0, mesh.numVert*mesh.numProp).filter((_,i)=>i%mesh.numProp<3)), 3));
  g.setIndex(new THREE.BufferAttribute(new Uint32Array(mesh.triVerts), 1));
  return toCreasedNormals(g, THREE.MathUtils.degToRad(30));
}
const unitMan = {};
const groupCache = new Map();
function baseGeom(o){
  if(o.type !== 'group') return {geom: unitGeom(o.type, o.seg||48), size: new THREE.Vector3(1,1,1)};
  const key = JSON.stringify(o.children);
  if(groupCache.has(key)) return groupCache.get(key);
  const res = csgOf(o.children);
  groupCache.set(key,res); return res;
}
const _tmp = new THREE.Object3D();
// Manifold de una figura ya colocada (posición, giro y tamaño). Quien lo pide debe liberarlo con delete().
function manifoldOf(o){
  let base;
  if(o.type === 'group') base = baseGeom(o).man;
  else { const k = o.type+'|'+(o.seg||48); base = unitMan[k] ||= toManifold(unitGeom(o.type, o.seg||48)); }
  placeObj(_tmp, o, baseGeom(o).size); _tmp.updateMatrix();
  return base.transform(_tmp.matrix.elements);
}
// une todos los sólidos y les resta los huecos
function unionOf(list){ const ms = list.map(manifoldOf); const u = Manifold.union(ms); ms.forEach(m=>m.delete()); return u; }
function csgOf(children){
  const solids = children.filter(c=>!c.hole), holes = children.filter(c=>c.hole);
  const empty = {geom:new THREE.BufferGeometry(), size:new THREE.Vector3(1,1,1), empty:true};
  if(!solids.length) return empty;
  let man = unionOf(solids);
  if(holes.length){ const h = unionOf(holes); const r = man.subtract(h); man.delete(); h.delete(); man = r; }
  if(man.isEmpty()){ man.delete(); return empty; }
  const g = fromManifold(man);
  g.computeBoundingBox();
  const size = new THREE.Vector3(); g.boundingBox.getSize(size);
  size.x = Math.max(size.x,0.001); size.y = Math.max(size.y,0.001); size.z = Math.max(size.z,0.001);
  return {geom:g, size, center: g.boundingBox.getCenter(new THREE.Vector3()), man};
}
function placeObj(m,o,size){
  m.position.set(o.x, o.y, o.z + o.h/2);
  m.rotation.set(THREE.MathUtils.degToRad(o.rx), THREE.MathUtils.degToRad(o.ry), THREE.MathUtils.degToRad(o.rz), 'XYZ');
  m.scale.set(o.w/size.x, o.d/size.y, o.h/size.z);
}

/* ---------- Mallas ---------- */
const meshes = new Map(); // id -> mesh
const world = new THREE.Group(); scene.add(world);
const matCache = {};
function material(o){
  if(o.hole){ return matCache.hole ||= new THREE.MeshStandardMaterial({color:0x6c7686, transparent:true, opacity:0.55, depthWrite:false, roughness:.6, polygonOffset:true, polygonOffsetFactor:-2, polygonOffsetUnits:-2}); }
  return matCache[o.color] ||= new THREE.MeshStandardMaterial({color:o.color, roughness:.55, metalness:.02});
}
function rebuild(){
  tcontrols.detach();
  for(const m of meshes.values()){ world.remove(m); m.children.forEach(c=>c.geometry.dispose()); }
  meshes.clear();
  for(const o of objects){
    const {geom,size} = baseGeom(o);
    const g = geom;
    const m = new THREE.Mesh(g, material(o));
    m.userData.id = o.id; m.userData.size = size;
    placeObj(m,o,size);
    if(o.hole) m.renderOrder = 2;
    const eg = o.type==='group' ? new THREE.EdgesGeometry(new THREE.BoxGeometry(size.x,size.y,size.z)) : new THREE.EdgesGeometry(g, 25);
    const edges = new THREE.LineSegments(eg, new THREE.LineBasicMaterial({color:css('--accent'), transparent:true, opacity:0.95}));
    const sel = selected.includes(o.id);
    if(o.hole && !sel) edges.material.color.set(0x4a5260);
    edges.visible = sel || o.hole; edges.raycast = ()=>{};
    m.add(edges);
    world.add(m); meshes.set(o.id,m);
  }
  if(selected.length===1 && meshes.has(selected[0])) tcontrols.attach(meshes.get(selected[0]));
  renderProps(); updateButtons();
}

/* ---------- Gizmo ---------- */
const tcontrols = new TransformControls(camera, canvas);
scene.add(tcontrols.getHelper());
tcontrols.setSize(0.9);
let dragging = false, dragBefore = null;
tcontrols.addEventListener('dragging-changed', e=>{
  orbit.enabled = !e.value; dragging = e.value;
  if(e.value){ dragBefore = snapshot(); }
  else { syncFromMesh(); }
});
tcontrols.addEventListener('objectChange', ()=>{
  const o = byId(selected[0]), m = tcontrols.object; if(!o || !m || selected.length!==1) return;
  const step = +$('#snap').value, hz = Math.abs(m.scale.z*m.userData.size.z)/2;
  if(tcontrols.mode==='translate' && step){
    const q = v => Math.round(v/step)*step;
    m.position.x = q(m.position.x); m.position.y = q(m.position.y); m.position.z = q(m.position.z-hz)+hz;
  }
  if(tcontrols.mode==='scale' && keepsBase(o)) m.position.z = o.z + hz;
  liveProps();
});
// al escalar, la base queda en su lugar (como en Tinkercad) si la figura no está inclinada
const keepsBase = o => !o.rx && !o.ry;
function setSnap(){
  const s = +$('#snap').value || null;
  tcontrols.setTranslationSnap(null);
  tcontrols.setRotationSnap(s ? THREE.MathUtils.degToRad(15) : null);
  tcontrols.setScaleSnap(null);
}
$('#snap').addEventListener('change', setSnap); setSnap();
function setMode(mode){
  tcontrols.setMode(mode); tcontrols.setSpace(mode==='scale'?'local':'world');
  document.querySelectorAll('[data-mode]').forEach(b=>b.classList.toggle('on', b.dataset.mode===mode));
}
document.querySelectorAll('[data-mode]').forEach(b=>b.addEventListener('click',()=>setMode(b.dataset.mode)));
function readMesh(o,m){
  const s = m.userData.size, step = +$('#snap').value;
  const q = v => step ? Math.round(v/step)*step : v;
  o.w = r2(Math.max(0.1, Math.abs(m.scale.x*s.x))); o.d = r2(Math.max(0.1, Math.abs(m.scale.y*s.y))); o.h = r2(Math.max(0.1, Math.abs(m.scale.z*s.z)));
  if(tcontrols.mode==='scale' && step){ o.w = Math.max(step,q(o.w)); o.d = Math.max(step,q(o.d)); o.h = Math.max(step,q(o.h)); }
  o.x = r2(m.position.x); o.y = r2(m.position.y);
  if(!(tcontrols.mode==='scale' && keepsBase(o))) o.z = r2(m.position.z - o.h/2);
  const toDeg = v => Math.round(THREE.MathUtils.radToDeg(v)*10)/10;
  o.rx = toDeg(m.rotation.x); o.ry = toDeg(m.rotation.y); o.rz = toDeg(m.rotation.z);
}
function syncFromMesh(){
  const o = byId(selected[0]), m = meshes.get(selected[0]); if(!o||!m) return;
  readMesh(o,m);
  if(snapshot()===dragBefore){ rebuild(); return; }
  undoStack.push(dragBefore); redoStack = []; rebuild(); autosave();
}

/* ---------- Selección ---------- */
const ray = new THREE.Raycaster(), ptr = new THREE.Vector2();
let downAt = null, overGizmo = false;
canvas.addEventListener('pointerdown', e=>{ downAt = [e.clientX,e.clientY]; overGizmo = tcontrols.object && tcontrols.axis !== null; }, true);
canvas.addEventListener('pointerup', e=>{
  if(!downAt || dragging || overGizmo){ downAt = null; return; }
  const moved = Math.hypot(e.clientX-downAt[0], e.clientY-downAt[1]); downAt = null;
  if(moved > 5 || tcontrols.dragging) return;
  const r = canvas.getBoundingClientRect();
  ptr.set((e.clientX-r.left)/r.width*2-1, -(e.clientY-r.top)/r.height*2+1);
  ray.setFromCamera(ptr, camera);
  const hits = ray.intersectObjects([...meshes.values()], false);
  // los huecos son transparentes: si el rayo pasa por uno, se elige el hueco aunque esté dentro de un sólido.
  // Con Mayús se prefiere una figura que aún no esté seleccionada, para poder sumar el hueco a la selección.
  const ids = [...new Set(hits.map(h=>h.object.userData.id))];
  const add = e.shiftKey || e.ctrlKey || e.metaKey;
  const order = [...ids.filter(i=>byId(i)?.hole), ...ids.filter(i=>!byId(i)?.hole)];
  const id = (add ? order.find(i=>!selected.includes(i)) : undefined) ?? order[0] ?? null;
  if(add){
    if(id!=null) selected = selected.includes(id) ? selected.filter(x=>x!==id) : [...selected,id];
  } else selected = id!=null ? [id] : [];
  rebuild();
});

/* ---------- Acciones ---------- */
function addShape(type, hole){
  const o = {id:nextId++, type, name:NAMES[type], hole:!!hole, color:PALETTE[(nextId-2)%PALETTE.length],
    w:type==='prisma'?17.32:20,d:20,h:20, x:0,y:0,z:0, rx:0,ry:0,rz:0, seg: ROUND.has(type)?48:undefined};
  // busca un lugar libre en la mesa para que la figura nueva no quede encima de otra
  const busy = (x,y) => objects.some(p=>Math.abs(p.x-x) < (p.w+o.w)/2+2 && Math.abs(p.y-y) < (p.d+o.d)/2+2);
  outer: for(let r=0; r<=80; r+=25) for(let dy=-r; dy<=r; dy+=25) for(let dx=-r; dx<=r; dx+=25){
    if(Math.max(Math.abs(dx),Math.abs(dy))!==r) continue;
    if(!busy(dx,dy)){ o.x = dx; o.y = dy; break outer; }
  }
  commit(()=>{ objects.push(o); selected=[o.id]; });
}
document.querySelectorAll('[data-add]').forEach(b=>b.addEventListener('click',()=>addShape(b.dataset.add, b.dataset.hole)));

function del(){ if(!selected.length) return; commit(()=>{ objects = objects.filter(o=>!selected.includes(o.id)); selected=[]; }); }
function dup(){
  if(!selected.length) return;
  commit(()=>{ const n=[]; for(const id of selected){ const c = structuredClone(byId(id)); c.id = nextId++; c.x = r2(c.x+10); c.y = r2(c.y-10); objects.push(c); n.push(c.id);} selected=n; });
}
function group(){
  // con menos de dos figuras seleccionadas, se agrupa todo lo que hay en la mesa (lo más simple para los alumnos)
  const ids = selected.length>=2 ? selected : objects.map(o=>o.id);
  const items = ids.map(byId).filter(Boolean);
  if(items.length<2){ toast('Necesitas al menos dos figuras en la mesa para agrupar.'); return; }
  if(items.every(o=>o.hole)){ toast('Un grupo necesita al menos una figura sólida.'); return; }
  const before = snapshot();
  // centro común en el mundo
  const box = new THREE.Box3(); items.forEach(o=>box.expandByObject(meshes.get(o.id)));
  const c = box.getCenter(new THREE.Vector3());
  let children = items.map(o=>{ const k = structuredClone(o); k.x=r2(k.x-c.x); k.y=r2(k.y-c.y); k.z=r2(k.z-c.z); return k; });
  let res = csgOf(children);
  if(res.empty){ toast('No quedó material: los huecos cubren todo.'); return; }
  const off = res.center; res.man.delete();
  children = children.map(k=>({...k, x:r2(k.x-off.x), y:r2(k.y-off.y), z:r2(k.z-off.z)}));
  res = csgOf(children); groupCache.set(JSON.stringify(children), res);
  const solid = items.find(o=>!o.hole);
  const g = {id:nextId++, type:'group', name:'Grupo', hole:false, color:solid.color, children,
    w:r2(res.size.x), d:r2(res.size.y), h:r2(res.size.z), x:r2(c.x+off.x), y:r2(c.y+off.y), z:r2(c.z+off.z-res.size.z/2), rx:0,ry:0,rz:0};
  undoStack.push(before); redoStack=[];
  objects = objects.filter(o=>!ids.includes(o.id)); objects.push(g); selected=[g.id];
  rebuild(); autosave(); toast('Grupo creado: se unieron los sólidos y se restaron los huecos.');
}
function ungroup(){
  const g = byId(selected[0]);
  if(selected.length!==1 || !g || g.type!=='group'){ toast('Selecciona un grupo para desagrupar.'); return; }
  commit(()=>{
    const gm = meshes.get(g.id); gm.updateMatrixWorld(true);
    const out = [];
    for(const k of g.children){
      const {size} = baseGeom(k);
      const tmp = new THREE.Object3D(); placeObj(tmp,k,size); tmp.updateMatrix();
      const M = gm.matrixWorld.clone().multiply(tmp.matrix);
      const p = new THREE.Vector3(), q = new THREE.Quaternion(), s = new THREE.Vector3(); M.decompose(p,q,s);
      const e = new THREE.Euler().setFromQuaternion(q,'XYZ');
      const n = structuredClone(k); n.id = nextId++;
      n.w = r2(s.x*size.x); n.d = r2(s.y*size.y); n.h = r2(s.z*size.z);
      n.x = r2(p.x); n.y = r2(p.y); n.z = r2(p.z - n.h/2);
      const d = v => Math.round(THREE.MathUtils.radToDeg(v)*10)/10; n.rx=d(e.x); n.ry=d(e.y); n.rz=d(e.z);
      out.push(n);
    }
    objects = objects.filter(o=>o.id!==g.id).concat(out); selected = out.map(o=>o.id);
  });
}
function dropToFloor(){
  const id = selected[0], o = byId(id), m = meshes.get(id); if(!o) return;
  const b = new THREE.Box3().setFromObject(m, true);
  commit(()=>{ o.z = r2(o.z - b.min.z); });
}
$('#bGroup').onclick = group; $('#bUngroup').onclick = ungroup;
$('#bUndo').onclick = undo; $('#bRedo').onclick = redo; $('#bDup').onclick = dup;
function updateButtons(){
  $('#bUndo').disabled = !undoStack.length; $('#bRedo').disabled = !redoStack.length;
  $('#bGroup').disabled = objects.length<2; $('#bDup').disabled = !selected.length;
  const g = byId(selected[0]); $('#bUngroup').disabled = !(selected.length===1 && g && g.type==='group');
  const solids = objects.filter(o=>!o.hole).length;
  $('#hint').textContent = !objects.length ? 'Elige una figura de la izquierda para empezar. Arrastra para girar la vista, rueda para acercar.'
    : (objects.some(o=>o.hole) ? 'Para hacer un agujero: pon una figura gris (hueco) dentro del sólido y pulsa Agrupar. Si nada está seleccionado, se agrupa todo.' : '');
}

const esc = s => String(s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function num(id,label,val,cls='',step='0.1'){ return `<label class="field"><span class="${cls}">${label}</span><input type="number" id="p_${id}" data-k="${id}" value="${val}" step="${step}"></label>`; }

// medidas totales de las figuras sólidas (lo que se va a imprimir)
function designSize(){
  const box = new THREE.Box3();
  for(const o of objects){ const m = meshes.get(o.id); if(m && !o.hole) box.union(new THREE.Box3().setFromObject(m, true)); }
  return box.isEmpty() ? null : box.getSize(new THREE.Vector3());
}
function liveProps(){
  const o = byId(selected[0]), m = meshes.get(selected[0]); if(!o||!m) return;
  const t = structuredClone(o); readMesh(t,m);
  for(const k of ['w','d','h','x','y','z','rx','ry','rz']){ const el = document.getElementById('p_'+k); if(el) el.value = t[k]; }
}

/* ---------- Teclado ---------- */
addEventListener('keydown', e=>{
  if(e.target.matches('input,select,textarea')) return;
  const mod = e.ctrlKey||e.metaKey, k = e.key.toLowerCase();
  if(mod && k==='z' && !e.shiftKey){ e.preventDefault(); undo(); return; }
  if(mod && (k==='y' || (k==='z'&&e.shiftKey))){ e.preventDefault(); redo(); return; }
  if(mod && k==='d'){ e.preventDefault(); dup(); return; }
  if(mod && k==='a'){ e.preventDefault(); selected = objects.map(o=>o.id); rebuild(); return; }
  if(mod && k==='g'){ e.preventDefault(); e.shiftKey ? ungroup() : group(); return; }
  if(mod && k==='s'){ e.preventDefault(); saveProject(); return; }
  if(k==='delete'||k==='backspace'){ e.preventDefault(); del(); return; }
  if(k==='escape'){ selected=[]; rebuild(); return; }
  if(!mod && k==='w') setMode('translate'); if(!mod && k==='e') setMode('rotate'); if(!mod && k==='r') setMode('scale');
  const step = +$('#snap').value || 1;
  const mv = {arrowleft:[-step,0,0],arrowright:[step,0,0],arrowup:[0,step,0],arrowdown:[0,-step,0],pageup:[0,0,step],pagedown:[0,0,-step]}[k];
  if(mv && selected.length){ e.preventDefault(); commit(()=>{ for(const id of selected){ const o=byId(id); o.x=r2(o.x+mv[0]); o.y=r2(o.y+mv[1]); o.z=r2(o.z+mv[2]); } }); }
});

/* ---------- Archivos ---------- */
const inViewer = !!(window.claude && window.claude.use);
const downloadsP = inViewer ? window.claude.use('downloads').catch(()=>null) : Promise.resolve(null);
function crc32(buf){ let c, crc = 0xFFFFFFFF; for(let i=0;i<buf.length;i++){ c = (crc ^ buf[i]) & 0xFF; for(let k=0;k<8;k++) c = c&1 ? 0xEDB88320^(c>>>1) : c>>>1; crc = (crc>>>8) ^ c; } return (crc ^ 0xFFFFFFFF)>>>0; }
function zipOne(name, data){
  const nb = new TextEncoder().encode(name), crc = crc32(data), n = data.length;
  const lh = new DataView(new ArrayBuffer(30)); lh.setUint32(0,0x04034b50,true); lh.setUint16(4,20,true); lh.setUint32(14,crc,true); lh.setUint32(18,n,true); lh.setUint32(22,n,true); lh.setUint16(26,nb.length,true);
  const ch = new DataView(new ArrayBuffer(46)); ch.setUint32(0,0x02014b50,true); ch.setUint16(4,20,true); ch.setUint16(6,20,true); ch.setUint32(16,crc,true); ch.setUint32(20,n,true); ch.setUint32(24,n,true); ch.setUint16(28,nb.length,true);
  const cdSize = 46+nb.length, cdOff = 30+nb.length+n;
  const eo = new DataView(new ArrayBuffer(22)); eo.setUint32(0,0x06054b50,true); eo.setUint16(8,1,true); eo.setUint16(10,1,true); eo.setUint32(12,cdSize,true); eo.setUint32(16,cdOff,true);
  return new Blob([lh,nb,data,ch,nb,eo]);
}
async function offer(filename, data, mime){
  const dl = await downloadsP;
  if(dl){
    try{ await dl.save({filename, data}); toast('Archivo guardado: '+filename); }
    catch(err){ if(err && err.code!=='declined') toast('No se pudo guardar el archivo ('+(err.code||'error')+').'); }
    return;
  }
  if(inViewer){ toast('Esta vista no permite descargar archivos. Abre la página en claude.ai.'); return; }
  const url = URL.createObjectURL(data instanceof Blob ? data : new Blob([data],{type:mime}));
  const a = document.createElement('a'); a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 2000); toast('Descargado: '+filename);
}
const safeName = s => (s||'pieza').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^\w-]+/g,'_').replace(/^_+|_+$/g,'') || 'pieza';
// STL binario: cabecera de 80 bytes, número de triángulos y 50 bytes por triángulo (normal + 3 vértices)
function stlBytes(man, dz){
  const mesh = man.getMesh(), P = mesh.vertProperties, T = mesh.triVerts, np = mesh.numProp, n = T.length/3;
  const buf = new ArrayBuffer(84 + 50*n), dv = new DataView(buf);
  new Uint8Array(buf).set(new TextEncoder().encode('Taller 3D'));
  dv.setUint32(80, n, true);
  const a = new THREE.Vector3(), b = new THREE.Vector3(), c = new THREE.Vector3(), nn = new THREE.Vector3(), e = new THREE.Vector3();
  const v = (out,i) => out.set(P[i*np], P[i*np+1], P[i*np+2]+dz);
  for(let t=0, o=84; t<n; t++, o+=50){
    v(a,T[3*t]); v(b,T[3*t+1]); v(c,T[3*t+2]);
    nn.subVectors(b,a).cross(e.subVectors(c,a)).normalize();
    const vals = [nn.x,nn.y,nn.z, a.x,a.y,a.z, b.x,b.y,b.z, c.x,c.y,c.z];
    for(let k=0;k<12;k++) dv.setFloat32(o+4*k, vals[k] || 0, true);
  }
  return new Uint8Array(buf);
}
async function exportStl(){
  const pick = selected.length ? selected.map(byId) : objects;
  const solids = pick.filter(o=>o && !o.hole);
  if(!solids.length){ toast('No hay figuras sólidas para exportar.'); return; }
  // todo se une en una sola pieza cerrada, apoyada sobre la cama (Z mínima = 0)
  // los huecos que aún no están agrupados también se restan, así el STL queda igual a lo que se ve en pantalla
  const holes = objects.filter(o=>o.hole);
  let man = unionOf(solids);
  if(holes.length){ const h = unionOf(holes), r = man.subtract(h); man.delete(); h.delete(); man = r; }
  if(man.isEmpty()){ man.delete(); toast('No queda material: los huecos cubren toda la pieza.'); return; }
  const bytes = stlBytes(man, -man.boundingBox().min[2]); man.delete();
  const base = safeName(solids.length===1 ? solids[0].name : 'diseno');
  const dl = await downloadsP;
  if(dl) await offer(base+'.zip', zipOne(base+'.stl', bytes));
  else await offer(base+'.stl', new Blob([bytes],{type:'model/stl'}));
  const msgs = [];
  if(selected.length) msgs.push(`Se exportó solo la selección (${solids.length} ${solids.length===1?'figura':'figuras'}). Para exportar todo, haz clic en un espacio vacío primero.`);
  if(holes.length) msgs.push('Los huecos se restaron de la pieza exportada.');
  msgs.forEach((m,i)=>setTimeout(()=>toast(m), 3200*(i+1)));
}
function saveProject(){
  const data = JSON.stringify({app:'taller3d', version:1, objects, nextId}, null, 1);
  offer('proyecto-taller3d.json', data, 'application/json');
}

  try{ const d = JSON.parse(await f.text()); if(d.app!=='taller3d' || !Array.isArray(d.objects)) throw 0;
    commit(()=>{ objects = d.objects; nextId = d.nextId || (Math.max(0,...objects.map(o=>o.id))+1); selected=[]; }); fitView(); toast('Proyecto abierto: '+f.name);
  }catch(_){ toast('Ese archivo no es un proyecto de Taller 3D (.json).'); }
};

/* ---------- Vistas ---------- */
function fitView(dir){
  const box = new THREE.Box3(); for(const m of meshes.values()) box.expandByObject(m);
  const c = box.isEmpty() ? new THREE.Vector3(0,0,10) : box.getCenter(new THREE.Vector3());
  const r = box.isEmpty() ? 60 : Math.max(40, box.getSize(new THREE.Vector3()).length());
  const d = dir || new THREE.Vector3(0.8,-1.2,0.9);
  camera.position.copy(c).add(d.clone().normalize().multiplyScalar(r*1.9));
  orbit.target.copy(c); orbit.update();
}
$('#vHome').onclick = ()=>fitView(); $('#vTop').onclick = ()=>fitView(new THREE.Vector3(0,-0.001,1)); $('#vFront').onclick = ()=>fitView(new THREE.Vector3(0,-1,0.15));
