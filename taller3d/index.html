<!doctype html>
<html lang="es">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Taller 3D · versión 10</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: herramientas arriba, figuras a la izquierda, mesa 3D al centro, medidas a la derecha (en móvil se apilan) */
:root{
  --bg:#eef1f5; --panel:#ffffff; --panel-2:#f5f7fa; --line:#d5dbe4; --fg:#18202b; --muted:#5b6778;
  --accent:#1f5fd1; --accent-ink:#ffffff; --accent-soft:#e3ecfb; --hole:#7a8494; --danger:#b42318;
  --scene:#e9edf3; --grid-major:#9aa6b6; --grid-minor:#cfd6e0;
  --f-ui:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-display:"Bricolage Grotesque","Atkinson Hyperlegible",system-ui,sans-serif;
  --f-num:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12161d; --panel:#1a2029; --panel-2:#212835; --line:#2f3847; --fg:#e7ecf3; --muted:#9aa6b8;
  --accent:#6b9cff; --accent-ink:#0d1420; --accent-soft:#1e2c47; --hole:#8d97a8; --danger:#ff8a80;
  --scene:#161b23; --grid-major:#4a5568; --grid-minor:#2a323f; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12161d; --panel:#1a2029; --panel-2:#212835; --line:#2f3847; --fg:#e7ecf3; --muted:#9aa6b8;
  --accent:#6b9cff; --accent-ink:#0d1420; --accent-soft:#1e2c47; --hole:#8d97a8; --danger:#ff8a80;
  --scene:#161b23; --grid-major:#4a5568; --grid-minor:#2a323f; color-scheme:dark}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-ui);font-size:14px;overflow:hidden}
*{box-sizing:border-box}
button,input,select{font:inherit;color:inherit}
.app{height:100%;display:grid;grid-template-columns:150px minmax(0,1fr) 260px;grid-template-rows:auto minmax(0,1fr);
  padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
header{grid-column:1/-1;display:flex;align-items:center;gap:5px;flex-wrap:wrap;padding:8px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px));
  background:var(--panel);border-bottom:1px solid var(--line)}
.brand{font-family:var(--f-display);font-size:19px;letter-spacing:-.01em;margin-right:6px;display:flex;align-items:center;gap:8px;white-space:nowrap}
.brand i{width:18px;height:18px;border:2px solid var(--accent);border-radius:3px;display:inline-block;position:relative;transform:rotate(-8deg)}
.brand i::after{content:"";position:absolute;inset:3px;border:2px dashed var(--hole);border-radius:50%}
.sep{width:1px;height:24px;background:var(--line);margin:0 2px}
.btn{border:1px solid var(--line);background:var(--panel-2);padding:6px 9px;border-radius:6px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;line-height:1.2}
.btn:hover{border-color:var(--accent)}
.btn:focus-visible,.shape:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.btn:disabled{opacity:.45;cursor:default;border-color:var(--line)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
.btn.on{background:var(--accent-soft);border-color:var(--accent);color:var(--fg)}
.seg{display:inline-flex}.seg .btn{border-radius:0}.seg .btn:first-child{border-radius:6px 0 0 6px}.seg .btn:last-child{border-radius:0 6px 6px 0}.seg .btn+.btn{border-left:none}
kbd{font-family:var(--f-num);font-size:10px;color:var(--muted)}
.spacer{flex:1}
header .btn{font-size:13px;padding:6px 8px}
@media (max-width:1440px) and (min-width:761px){ header .brand{font-size:0;gap:0;margin-right:2px} header{gap:4px} header .btn{padding:6px 7px} }
select.btn{padding-right:6px}
aside{background:var(--panel);overflow:auto;min-height:0}
.shapes{border-right:1px solid var(--line);padding:12px 10px;display:flex;flex-direction:column;gap:6px}
.label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700;margin:4px 2px}
.grp{display:flex;flex-direction:column;gap:6px}
.grp+.grp{margin-top:6px;border-top:1px solid var(--line);padding-top:6px}
.grphead{display:flex;align-items:center;justify-content:space-between;width:100%;border:none;background:none;cursor:pointer;padding:4px 2px;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700;text-align:left}
.grphead::after{content:"▾";font-size:12px;transition:transform .15s}
.grphead[aria-expanded="false"]::after{transform:rotate(-90deg)}
.grphead:hover{color:var(--fg)}
.grpbody{display:flex;flex-direction:column;gap:6px}
.grp.closed .grpbody{display:none}
.shape{display:flex;align-items:center;gap:10px;padding:7px 8px;border:1px solid transparent;border-radius:8px;background:none;cursor:pointer;text-align:left;width:100%}
.shape:hover{background:var(--panel-2);border-color:var(--line)}
.shape svg{width:30px;height:30px;flex:none}
.shape svg *{fill:none;stroke:var(--fg);stroke-width:1.6;stroke-linejoin:round}
.shape.holeshape svg *{stroke:var(--hole);stroke-dasharray:3 2}
.viewport{position:relative;min-width:0;min-height:0;background:var(--scene)}
#c{display:block;width:100%;height:100%;touch-action:none}
.hud{position:absolute;left:12px;bottom:12px;display:flex;gap:6px;flex-wrap:wrap}
.hud .btn{background:var(--panel)}
/* cubo de vistas (esquina superior derecha de la mesa) */
.navcube{position:absolute;right:12px;top:10px;display:flex;flex-direction:column;align-items:center;gap:6px;user-select:none}
#cube{width:120px;height:120px;cursor:pointer;display:block;touch-action:none}
.navcube .nav{display:grid;grid-template-columns:repeat(3,34px);gap:4px}
.navcube .btn{background:var(--panel);justify-content:center;padding:5px 0;font-size:15px;line-height:1}
@media (max-width:760px){ #cube{width:92px;height:92px} .navcube .nav{grid-template-columns:repeat(3,28px)} .hint{right:120px} }
.hint{position:absolute;left:12px;top:12px;right:150px;pointer-events:none;color:var(--muted);font-size:13px;max-width:52ch}
.toast{position:absolute;left:50%;top:14px;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90%;text-align:center}
.toast.show{opacity:1}
.loading{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);text-align:center;padding:16px;line-height:1.5}
.props{border-left:1px solid var(--line);padding:12px 14px;display:flex;flex-direction:column;gap:12px}
.props .field,.props .grid3,.props .row{flex:none}
/* sin esto, en paneles largos el navegador aplastaba la barra Sólido/Hueco hasta hacerla desaparecer */
.props > *{flex-shrink:0}
.props h2{font-family:var(--f-display);font-size:17px;margin:0;text-wrap:balance}
.empty{color:var(--muted);line-height:1.5}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.field{display:flex;flex-direction:column;gap:3px;min-width:0}
.field span{font-size:11px;color:var(--muted)}
.field input,.field select{width:100%;min-width:0;padding:5px 6px;border:1px solid var(--line);border-radius:5px;background:var(--panel-2);font-family:var(--f-num);font-size:13px;font-variant-numeric:tabular-nums}
.field input[type=color]{padding:2px;height:32px}
.field input[type=text]{font-family:var(--f-ui)}
.sizehead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:4px}
.sizehead .label{margin:0}
.lock{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel-2);border-radius:6px;padding:4px 8px;cursor:pointer;font-size:12px;color:var(--muted)}
.lock svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}
.lock.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.lock:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.abtn{justify-content:center;padding:7px 4px;font-size:12.5px;min-width:0;overflow:hidden;text-overflow:ellipsis}
.axis-x{color:#d64545}.axis-y{color:#2f9e44}.axis-z{color:var(--accent)}
.toggle{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex:none;min-height:40px}
.toggle button{border:none;background:var(--panel-2);padding:8px;cursor:pointer;min-height:38px;font-weight:700}
.toggle button.on{background:var(--accent);color:var(--accent-ink);font-weight:700}
.toggle button.on.h{background:var(--hole);color:#fff}
.row{display:flex;gap:6px;flex-wrap:wrap}
.btn.danger{color:var(--danger)}
.check{display:flex;gap:8px;align-items:center;cursor:pointer}
.note{font-size:12px;color:var(--muted);line-height:1.45}
.units{font-family:var(--f-num);font-size:11px;color:var(--muted)}
@media (max-width:760px){
  body{overflow:auto}
  .app{grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto 58vh auto;height:auto;min-height:100%}
  .shapes{flex-direction:row;overflow-x:auto;border-right:none;border-bottom:1px solid var(--line);padding:8px 16px}
  .shapes .label,.shapes .note,.grphead{display:none}
  .grp,.grpbody,.grp.closed .grpbody{display:contents}
  .shape{width:auto;flex:none;flex-direction:column;gap:2px;font-size:11px;padding:6px}
  .props{border-left:none;border-top:1px solid var(--line);padding:14px max(16px,env(safe-area-inset-right,0px)) 14px max(16px,env(safe-area-inset-left,0px))}
  kbd,.sep{display:none}
}
/* medidas sobre la figura elegida */
.dims{position:absolute;left:0;top:0;pointer-events:none;background:var(--panel);color:var(--fg);border:1px solid var(--accent);border-radius:6px;padding:3px 8px;font-family:var(--f-num);font-size:12px;white-space:nowrap;transform:translate(-50%,-100%);box-shadow:0 2px 6px rgb(0 0 0 / .12)}
/* guía de bienvenida */
.guide{position:absolute;inset:0;display:grid;place-items:center;background:rgb(10 14 20 / .35);padding:16px;z-index:5}
.guide .card{background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:12px;max-width:440px;width:100%;padding:20px 22px;box-shadow:0 10px 30px rgb(0 0 0 / .25);max-height:100%;overflow:auto}
.guide h3{font-family:var(--f-display);font-size:20px;margin:0 0 4px}
.guide .step{font-size:12px;color:var(--muted);font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.guide p,.guide li{line-height:1.5;font-size:14.5px}
.guide ul{padding-left:18px;margin:8px 0}
.guide .dots{display:flex;gap:6px;margin:12px 0}
.guide .dots i{width:8px;height:8px;border-radius:50%;background:var(--line)}
.guide .dots i.on{background:var(--accent)}
.guide .row{justify-content:flex-end}
.checks{list-style:none;padding:0;margin:10px 0}
.checks li{display:grid;grid-template-columns:24px 1fr;gap:6px;padding:6px 0;border-top:1px solid var(--line)}
.checks li:first-child{border-top:none}
.checks .ok{color:#2f9e44;font-weight:700}.checks .warn{color:#e8590c;font-weight:700}
.tabs{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:8px;overflow:hidden;margin:10px 0}
.tabs button{border:none;background:var(--panel-2);padding:8px;cursor:pointer;font-weight:700}
.tabs button.on{background:var(--accent);color:var(--accent-ink)}
.dlgform{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>

<div class="app">
  <header>
    <div class="brand"><i></i>Taller 3D</div>
    <button class="btn" id="bNew" title="Empezar un diseño nuevo">Nuevo</button>
    <button class="btn" id="bOpen" title="Abrir un proyecto guardado (.json) o una pieza STL">Abrir</button>
    <button class="btn" id="bSave" title="Guardar el proyecto en un archivo para seguir otro día (Ctrl+S)">Guardar</button>
    <button class="btn" id="bImport" title="Traer una pieza STL a la mesa para modificarla">Importar STL</button>
    <input type="file" id="fileOpen" accept=".json,application/json,.stl,model/stl" hidden>
    <span class="sep"></span>
    <button class="btn" id="bUndo" title="Deshacer (Ctrl+Z)">↶ Deshacer</button>
    <button class="btn" id="bRedo" title="Rehacer (Ctrl+Y)">↷ Rehacer</button>
    <button class="btn" id="bDup" title="Duplicar la selección (Ctrl+D)">Duplicar</button>
    <span class="sep"></span>
    <div class="seg" role="group" aria-label="Herramienta">
      <button class="btn on" data-mode="translate" title="Mover (W)">Mover</button>
      <button class="btn" data-mode="rotate" title="Rotar (E)">Rotar</button>
      <button class="btn" data-mode="scale" title="Escalar (R). Arrastra los cubitos; mantén Shift para ajuste fino de 0,1 mm">Escalar</button>
    </div>
    <select class="btn" id="snap" title="Ajuste a la cuadrícula: cuánto avanza la figura al moverla o cambiar su tamaño">
      <option value="0">Ajuste: libre</option><option value="0.5">Ajuste: 0,5 mm</option><option value="1" selected>Ajuste: 1 mm</option><option value="5">Ajuste: 5 mm</option><option value="10">Ajuste: 10 mm</option>
    </select>
    <span class="sep"></span>
    <button class="btn" id="bGroup" title="Agrupar: une las figuras sólidas y resta los huecos. Sin selección, agrupa todo (Ctrl+G)">Agrupar</button>
    <button class="btn" id="bUngroup" title="Separar un grupo en sus figuras (Ctrl+Shift+G)">Desagrupar</button>
    <span class="spacer"></span>
    <button class="btn" id="bHelp" title="Ver la guía y los atajos de teclado (Taller 3D versión 10)">? Ayuda <small style="color:var(--muted);font-size:11px">v10</small></button>
    <button class="btn primary" id="bStl" title="Descargar en formato STL para imprimir (todo el diseño, o solo lo seleccionado)">Exportar STL</button>
  </header>

  <aside class="shapes" aria-label="Figuras">
    <div class="grp" data-grp="basicas"><button class="grphead" aria-expanded="true">Figuras básicas</button><div class="grpbody">
    <button class="shape" data-add="caja"><svg viewBox="0 0 32 32"><path d="M6 11l10-5 10 5v11l-10 5-10-5z"/><path d="M6 11l10 5 10-5M16 16v11"/></svg>Caja</button>
    <button class="shape" data-add="cilindro"><svg viewBox="0 0 32 32"><ellipse cx="16" cy="8" rx="9" ry="3.5"/><path d="M7 8v16c0 2 4 3.5 9 3.5s9-1.5 9-3.5V8"/></svg>Cilindro</button>
    <button class="shape" data-add="esfera"><svg viewBox="0 0 32 32"><circle cx="16" cy="16" r="10"/><ellipse cx="16" cy="16" rx="10" ry="3.5"/></svg>Esfera</button>
    <button class="shape" data-add="cono"><svg viewBox="0 0 32 32"><path d="M16 4L7 24c0 2 4 3.5 9 3.5s9-1.5 9-3.5z"/></svg>Cono</button>
    <button class="shape" data-add="piramide"><svg viewBox="0 0 32 32"><path d="M16 4L5 21l9 6 13-5z"/><path d="M16 4l-2 23"/></svg>Pirámide</button>
    <button class="shape" data-add="prisma"><svg viewBox="0 0 32 32"><path d="M9 6h14l4 4-4 4H9l-4-4z"/><path d="M5 10v13l4 4h14l4-4V10M9 14v13M23 14v13"/></svg>Hexágono</button>
    <button class="shape" data-add="cuna"><svg viewBox="0 0 32 32"><path d="M4 24h17l7-5H11z"/><path d="M4 24l7-14 10 14M11 10l17 9"/></svg>Techo</button>
    <button class="shape" data-add="texto"><svg viewBox="0 0 32 32"><path d="M5 26L12 6h2l7 20M8 19h10"/><path d="M27 26v-9c0-2-1.5-3-3.5-3s-3.5 1-3.5 3M27 21c-5 0-7 1-7 3s1.5 2.5 3 2.5 4-1 4-3"/></svg>Texto</button>
    </div></div>
    <div class="grp" data-grp="complejas"><button class="grphead" aria-expanded="true">Figuras complejas</button><div class="grpbody">
    <button class="shape" data-add="tubo"><svg viewBox="0 0 32 32"><ellipse cx="16" cy="8" rx="9" ry="3.5"/><ellipse cx="16" cy="8" rx="5" ry="1.8"/><path d="M7 8v16c0 2 4 3.5 9 3.5s9-1.5 9-3.5V8"/></svg>Tubo</button>
    <button class="shape" data-add="estrella"><svg viewBox="0 0 32 32"><path d="M16 4l3.5 7.5 8 .9-6 5.5 1.7 8L16 21.8 8.8 25.9l1.7-8-6-5.5 8-.9z"/></svg>Estrella</button>
    <button class="shape" data-add="corazon"><svg viewBox="0 0 32 32"><path d="M16 27C8 21 4 16.5 4 11.5 4 8 6.6 5.5 9.8 5.5c2.6 0 4.6 1.6 6.2 4 1.6-2.4 3.6-4 6.2-4 3.2 0 5.8 2.5 5.8 6 0 5-4 9.5-12 15.5z"/></svg>Corazón</button>
    <button class="shape" data-add="poligono"><svg viewBox="0 0 32 32"><path d="M16 5l10.5 7.6-4 12.4h-13l-4-12.4z"/></svg>Polígono</button>
    <button class="shape" data-add="dona"><svg viewBox="0 0 32 32"><ellipse cx="16" cy="16" rx="12" ry="7"/><ellipse cx="16" cy="15" rx="5" ry="2.4"/></svg>Dona</button>
    <button class="shape" data-add="arco"><svg viewBox="0 0 32 32"><path d="M4 26V18a12 12 0 0 1 24 0v8h-5v-8a7 7 0 0 0-14 0v8z"/></svg>Arco</button>
    <button class="shape" data-add="rosca"><svg viewBox="0 0 32 32"><path d="M10 4h12v24H10z"/><path d="M10 8l12-3M10 13l12-3M10 18l12-3M10 23l12-3M10 28l12-3"/></svg>Rosca</button>
    <button class="shape" data-add="tuerca"><svg viewBox="0 0 32 32"><path d="M9 6h14l7 10-7 10H9L2 16z"/><circle cx="16" cy="16" r="5"/></svg>Tuerca</button>
    <button class="shape" data-add="engranaje"><svg viewBox="0 0 32 32"><path d="M14 3h4l1 4 3 1.3 3.5-2.2 2.8 2.8-2.2 3.5L27.4 15l4 1v0l-4 1-1.3 3 2.2 3.5-2.8 2.8-3.5-2.2-3 1.3-1 4h-4l-1-4-3-1.3-3.5 2.2-2.8-2.8 2.2-3.5L4.6 17l-4-1 4-1 1.3-3-2.2-3.5 2.8-2.8 3.5 2.2 3-1.3z"/><circle cx="16" cy="16" r="3.5"/></svg>Engranaje</button>
    <button class="shape" data-add="corona"><svg viewBox="0 0 32 32"><circle cx="16" cy="16" r="13"/><path d="M16 7l2 2.5 3-1 .5 3 3 1-1 3 2.5 2-2.5 2 1 3-3 1-.5 3-3-1-2 2.5-2-2.5-3 1-.5-3-3-1 1-3L6.5 16 9 14l-1-3 3-1 .5-3 3 1z"/></svg>Corona</button>
    <button class="shape" data-add="cremallera"><svg viewBox="0 0 32 32"><path d="M2 24h28v-6h-2l-1.5-5h-3L22 18h-2l-1.5-5h-3L14 18h-2l-1.5-5h-3L6 18H2z"/></svg>Cremallera</button>
    </div></div>
    <div class="grp holes" data-grp="huecos"><button class="grphead" aria-expanded="true">Huecos</button><div class="grpbody">
    <button class="shape holeshape" data-add="caja" data-hole="1"><svg viewBox="0 0 32 32"><path d="M6 11l10-5 10 5v11l-10 5-10-5z"/><path d="M6 11l10 5 10-5M16 16v11"/></svg>Caja hueca</button>
    <button class="shape holeshape" data-add="cilindro" data-hole="1"><svg viewBox="0 0 32 32"><ellipse cx="16" cy="8" rx="9" ry="3.5"/><path d="M7 8v16c0 2 4 3.5 9 3.5s9-1.5 9-3.5V8"/></svg>Cilindro hueco</button>
    <button class="shape holeshape" data-add="texto" data-hole="1"><svg viewBox="0 0 32 32"><path d="M5 26L12 6h2l7 20M8 19h10"/><path d="M27 26v-9c0-2-1.5-3-3.5-3s-3.5 1-3.5 3M27 21c-5 0-7 1-7 3s1.5 2.5 3 2.5 4-1 4-3"/></svg>Texto hueco</button>
    <p class="note">Pon un hueco dentro de un sólido y pulsa <b>Agrupar</b>: queda el agujero. Con <b>Texto hueco</b> puedes grabar letras.</p>
    </div></div>
  </aside>

  <main class="viewport" id="vp">
    <canvas id="c" aria-label="Mesa de trabajo 3D"></canvas>
    <div class="loading" id="loading">Cargando la mesa de trabajo…</div>
    <div class="hint" id="hint"></div>
    <div class="navcube">
      <canvas id="cube" aria-label="Cubo de vistas: haz clic en una cara, borde o esquina para ver la pieza desde ese lado"></canvas>
      <div class="nav">

// Manifold de una figura ya colocada (posición, giro y tamaño). Quien lo pide debe liberarlo con delete().

tcontrols.addEventListener('objectChange', ()=>{

    const fine = shiftDown, step = fine ? 0.1 : (+$('#snap').value || 1), gain = fine ? 0.25 : 1;
    const size = m.userData.size, K = ['x','y','z'];
    const start = K.map(k=>Math.abs(scaleStart[k]*size[k]));             // medidas en mm al empezar

    const mmPerPx = 2*camera.position.distanceTo(m.position)*Math.tan(THREE.MathUtils.degToRad(camera.fov)/2)/H;

function placeFree(o){
  // busca un lugar libre en la mesa para que la figura nueva no quede encima de otra
  const busy = (x,y) => objects.some(p=>Math.abs(p.x-x) < (p.w+o.w)/2+2 && Math.abs(p.y-y) < (p.d+o.d)/2+2);
  const st = Math.max(25, Math.ceil(Math.max(o.w,o.d)/5)*5+5);
  for(let r=0; r<=st*4; r+=st) for(let dy=-r; dy<=r; dy+=st) for(let dx=-r; dx<=r; dx+=st){
    if(Math.max(Math.abs(dx),Math.abs(dy))!==r) continue;
    if(!busy(dx,dy)){ o.x = dx; o.y = dy; return; }
  }
}

function group(){
  // con menos de dos figuras seleccionadas, se agrupa todo lo que hay en la mesa (lo más simple para los alumnos)
  const ids = selected.length>=2 ? selected : objects.map(o=>o.id);
  const items = ids.map(byId).filter(Boolean);
  if(items.length<2){ toast('Necesitas al menos dos figuras en la mesa para agrupar.'); return; }
  if(items.every(o=>o.hole)){ toast('Un grupo necesita al menos una figura sólida.'); return; }
  if(items.some(isOpenMesh)){ toast('Una pieza importada tiene errores (no es cerrada) y no se puede unir. Sí se puede exportar tal cual.'); return; }
  if(items.some(o=>baseGeom(o).pending)){ toast('Espera un momento: todavía se está cargando la letra.'); return; }
  const before = snapshot();
  // centro común en el mundo
  const box = new THREE.Box3(); items.forEach(o=>box.expandByObject(meshes.get(o.id)));
  const c = box.getCenter(new THREE.Vector3());
  let children = items.map(o=>{ const k = structuredClone(o); k.x=r2(k.x-c.x); k.y=r2(k.y-c.y); k.z=r2(k.z-c.z); return k; });
  let res = csgOf(children);
  if(res.empty){ toast('No quedó material: los huecos cubren todo.'); return; }
  const off = res.center; res.man.delete();
  children = children.map(k=>({...k, x:r2(k.x-off.x), y:r2(k.y-off.y), z:r2(k.z-off.z)}));
  res = csgOf(children); groupCache.set(JSON.stringify(children), res);
  const solid = items.find(o=>!o.hole);
  const g = {id:nextId++, type:'group', name:'Grupo', hole:false, color:solid.color, children,
    w:r2(res.size.x), d:r2(res.size.y), h:r2(res.size.z), x:r2(c.x+off.x), y:r2(c.y+off.y), z:r2(c.z+off.z-res.size.z/2), rx:0,ry:0,rz:0};
  undoStack.push(before); redoStack=[];
  objects = objects.filter(o=>!ids.includes(o.id)); objects.push(g); selected=[g.id];
  rebuild(); autosave(); toast('Grupo creado: se unieron los sólidos y se restaron los huecos.');
}
function ungroup(){
  const g = byId(selected[0]);
  if(selected.length!==1 || !g || g.type!=='group'){ toast('Selecciona un grupo para desagrupar.'); return; }
  commit(()=>{
    const gm = meshes.get(g.id); gm.updateMatrixWorld(true);
    const out = [];
    for(const k of g.children){
      const {size} = baseGeom(k);
      const tmp = new THREE.Object3D(); placeObj(tmp,k,size); tmp.updateMatrix();
      const M = gm.matrixWorld.clone().multiply(tmp.matrix);
      const p = new THREE.Vector3(), q = new THREE.Quaternion(), s = new THREE.Vector3(); M.decompose(p,q,s);
      const e = new THREE.Euler().setFromQuaternion(q,'XYZ');
      const n = structuredClone(k); n.id = nextId++;
      // si quedó en espejo, three.js lo deja como escala X negativa
      delete n.mx; delete n.my; delete n.mz; if(s.x<0) n.mx = true;
      n.w = r2(Math.abs(s.x)*size.x); n.d = r2(Math.abs(s.y)*size.y); n.h = r2(Math.abs(s.z)*size.z);
      n.x = r2(p.x); n.y = r2(p.y); n.z = r2(p.z - n.h/2);
      const d = v => Math.round(THREE.MathUtils.radToDeg(v)*10)/10; n.rx=d(e.x); n.ry=d(e.y); n.rz=d(e.z);
      out.push(n);
    }
    objects = objects.filter(o=>o.id!==g.id).concat(out); selected = out.map(o=>o.id);
  });
}
function dropToFloor(){
  const id = selected[0], o = byId(id), m = meshes.get(id); if(!o) return;
  const b = new THREE.Box3().setFromObject(m, true);
  commit(()=>{ o.z = r2(o.z - b.min.z); });
}
// Reflejar (espejo) en un eje del mundo: cambia el signo del eje, ajusta el giro y refleja la posición
function mirror(axis){
  const items = selected.map(byId).filter(Boolean); if(!items.length) return;
  const i = 'xyz'.indexOf(axis);
  let c;
  if(items.length===1){ const o = items[0]; c = [o.x, o.y, o.z+o.h/2][i]; }
  else { const box = new THREE.Box3(); items.forEach(o=>box.union(new THREE.Box3().setFromObject(meshes.get(o.id), true))); c = box.getCenter(new THREE.Vector3()).getComponent(i); }
  commit(()=>{ for(const o of items){
    if(axis==='x'){ o.ry = -o.ry; o.rz = -o.rz; o.x = r2(2*c - o.x); }
    if(axis==='y'){ o.rx = -o.rx; o.rz = -o.rz; o.y = r2(2*c - o.y); }
    if(axis==='z'){ o.rx = -o.rx; o.ry = -o.ry; const zc = 2*c - (o.z + o.h/2); o.z = r2(zc - o.h/2); }
    const f = 'm'+axis; if(o[f]) delete o[f]; else o[f] = true;
    for(const k of ['rx','ry','rz']) if(Object.is(o[k],-0)) o[k] = 0;
  }});
  toast(`Reflejado en ${axis.toUpperCase()} (espejo).`);
}
// Alinear: lleva las figuras al borde o centro común de toda la selección
function align(axis, where){
  const items = selected.map(byId).filter(Boolean); if(items.length<2) return;
  const i = 'xyz'.indexOf(axis), boxes = new Map(), all = new THREE.Box3();
  for(const o of items){ const b = new THREE.Box3().setFromObject(meshes.get(o.id), true); boxes.set(o.id,b); all.union(b); }
  const pick = b => where==='min' ? b.min.getComponent(i) : where==='max' ? b.max.getComponent(i) : (b.min.getComponent(i)+b.max.getComponent(i))/2;
  const target = pick(all);
  commit(()=>{ for(const o of items){ o[axis] = r2(o[axis] + target - pick(boxes.get(o.id))); } });
}
// Girar 90° en un eje del mundo: la selección gira como un bloque y su base queda a la misma altura
function turn90(axis){
  const items = selected.map(byId).filter(Boolean); if(!items.length) return;
  const box = new THREE.Box3(); items.forEach(o=>box.union(new THREE.Box3().setFromObject(meshes.get(o.id), true)));
  const pivot = box.getCenter(new THREE.Vector3()), minZ = box.min.z;
  const R = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(axis==='x'?1:0, axis==='y'?1:0, axis==='z'?1:0), Math.PI/2);
  const deg = v => { const d = Math.round(THREE.MathUtils.radToDeg(v)*10)/10; return Object.is(d,-0) ? 0 : d; };
  commit(()=>{ for(const o of items){
    const m = meshes.get(o.id);
    const c = new THREE.Vector3(o.x, o.y, o.z+o.h/2).sub(pivot).applyQuaternion(R).add(pivot);
    const q = R.clone().multiply(m.quaternion), e = new THREE.Euler().setFromQuaternion(q,'XYZ');
    o.rx = deg(e.x); o.ry = deg(e.y); o.rz = deg(e.z);
    o.x = r2(c.x); o.y = r2(c.y); o.z = r2(c.z - o.h/2);
  }});
  if(axis !== 'z'){
    // que no quede hundida ni flotando: misma base que antes
    const nb = new THREE.Box3(); items.forEach(o=>nb.union(new THREE.Box3().setFromObject(meshes.get(o.id), true)));
    const dz = r2(minZ - nb.min.z); if(dz){ items.forEach(o=>{ o.z = r2(o.z + dz); }); rebuild(); autosave(); }
  }
}

// rota una figura alrededor del eje Z del mundo (posición y orientación)
function rotateAboutZ(o, ang, cx, cy, spin){
  const c = Math.cos(ang), s = Math.sin(ang), dx = o.x - cx, dy = o.y - cy;
  o.x = r2(cx + dx*c - dy*s); o.y = r2(cy + dx*s + dy*c);
  if(spin){
    const q = new THREE.Quaternion().setFromEuler(new THREE.Euler(...['rx','ry','rz'].map(k=>THREE.MathUtils.degToRad(o[k])), 'XYZ'));
    q.premultiply(new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0,0,1), ang));
    const e = new THREE.Euler().setFromQuaternion(q, 'XYZ'), deg = v => { const d = Math.round(THREE.MathUtils.radToDeg(v)*10)/10; return Object.is(d,-0) ? 0 : d; };
    o.rx = deg(e.x); o.ry = deg(e.y); o.rz = deg(e.z);
  }
}

/* ---------- Revisar antes de imprimir ---------- */
let PRINTER = {x:200, y:200, z:200};
try{ PRINTER = {...PRINTER, ...JSON.parse(localStorage.getItem('taller3d-impresora')||'{}')}; }catch(e){}
const MIN_WALL = 0.8;  // mm: menos que esto suele salir mal en una impresora FDM con boquilla de 0,4 mm
// grosor de pared aproximado: rayos hacia adentro desde puntos al azar de la superficie (según el área)
function thinFraction(man){
  const g0 = fromManifold(man), g = g0.index ? g0.toNonIndexed() : g0, pos = g.attributes.position, nt = pos.count/3;
  const mesh = new THREE.Mesh(g, new THREE.MeshBasicMaterial({side: THREE.DoubleSide}));
  const A = new THREE.Vector3(), B = new THREE.Vector3(), C = new THREE.Vector3(), N = new THREE.Vector3(), E = new THREE.Vector3();
  const cum = new Float64Array(nt); let tot = 0;
  for(let t=0;t<nt;t++){ A.fromBufferAttribute(pos,3*t); B.fromBufferAttribute(pos,3*t+1); C.fromBufferAttribute(pos,3*t+2); tot += N.subVectors(B,A).cross(E.subVectors(C,A)).length()/2; cum[t] = tot; }
  const samples = nt > 20000 ? 250 : 500, rc = new THREE.Raycaster(); rc.far = MIN_WALL;
  let thin = 0, minT = Infinity, seed = 12345; const rnd = () => (seed = (seed*16807) % 2147483647) / 2147483647;
  for(let k=0;k<samples;k++){
    const r = rnd()*tot; let lo = 0, hi = nt-1; while(lo<hi){ const m = (lo+hi)>>1; if(cum[m] < r) lo = m+1; else hi = m; }
    A.fromBufferAttribute(pos,3*lo); B.fromBufferAttribute(pos,3*lo+1); C.fromBufferAttribute(pos,3*lo+2);
    N.subVectors(B,A).cross(E.subVectors(C,A)).normalize();
    const u = rnd(), v = rnd()*(1-u), P = A.clone().multiplyScalar(1-u-v).addScaledVector(B,u).addScaledVector(C,v);
    rc.set(P.addScaledVector(N, -0.002), N.clone().negate());
    // solo cuenta si el rayo sale por la cara opuesta (no por una cara vecina en una esquina)
    const dir = rc.ray.direction;
    const hit = rc.intersectObject(mesh, false).find(h=>h.distance > 0.02 && h.face && h.face.normal.dot(dir) > 0.5);
    if(hit){ thin++; minT = Math.min(minT, hit.distance); }
  }
  g.dispose(); return {frac: thin/samples, minT};
}
async function checkPrint(){
  const solids = objects.filter(o=>!o.hole && !isOpenMesh(o)), holes = objects.filter(o=>o.hole && !isOpenMesh(o));
  if(!objects.some(o=>!o.hole)){ toast('No hay figuras sólidas para revisar.'); return; }
  if(objects.some(o=>baseGeom(o).pending)){ toast('Espera un momento: todavía se está cargando la letra.'); return; }
  openDlg(`<div class="step">Revisar antes de imprimir</div><h3>Revisando la pieza…</h3><p class="note">Esto toma unos segundos.</p>`);
  await new Promise(r=>setTimeout(r, 60));
  const items = [], f = v => (Math.round(v*10)/10).toString().replace('.',',');
  let man = solids.length ? unionOf(solids) : null;
  if(man && holes.length){ const h = unionOf(holes), r = man.subtract(h); man.delete(); h.delete(); man = r; }
  if(!man || man.isEmpty()){ man && man.delete(); openDlg(`<h3>No queda material</h3><p>Los huecos cubren toda la pieza.</p><div class="row"><button class="btn primary" data-close>Cerrar</button></div>`); return; }
  const bb = man.boundingBox(), size = [0,1,2].map(i=>bb.max[i]-bb.min[i]);
  // 1) tamaño de la impresora
  const fits = size[0] <= PRINTER.x && size[1] <= PRINTER.y && size[2] <= PRINTER.z;
  items.push([fits, fits ? `Cabe en tu impresora: la pieza mide ${f(size[0])} × ${f(size[1])} × ${f(size[2])} mm (la impresora, ${PRINTER.x} × ${PRINTER.y} × ${PRINTER.z} mm).`
    : `Es más grande que tu impresora: mide ${f(size[0])} × ${f(size[1])} × ${f(size[2])} mm y la impresora ${PRINTER.x} × ${PRINTER.y} × ${PRINTER.z} mm. Achícala con el candado cerrado.`]);
  // 2) piezas flotando
  const comps = man.decompose(), minZ = bb.min[2];
  const floating = comps.filter(c=>c.boundingBox().min[2] > minZ + 0.05).length;
  items.push([!floating, floating ? `${floating} ${floating===1?'parte queda flotando':'partes quedan flotando'} en el aire, sin tocar la mesa ni otra figura. La impresora no puede imprimir en el aire: bájala con "Apoyar en la mesa" o júntala con otra figura.`
    : (comps.length > 1 ? `Todo apoya en la mesa. Son ${comps.length} piezas separadas: se imprimirán sueltas.` : 'Todo apoya en la mesa y es una sola pieza.')]);
  if(minZ > 0.05) items.push([true, `La pieza está ${f(minZ)} mm sobre la mesa; al exportar se apoya sola en Z = 0.`]);
  comps.forEach(c=>c.delete());
  // 3) paredes delgadas
  const th = thinFraction(man); man.delete();
  const thinBad = th.frac > 0.02;
  items.push([!thinBad, thinBad ? `Hay paredes o partes muy delgadas (cerca de ${f(th.minT)} mm). Lo recomendable es al menos ${f(MIN_WALL)} mm, o pueden salir rotas o no imprimirse.`
    : `Las paredes tienen al menos ${f(MIN_WALL)} mm de grosor (las puntas finas aisladas no cuentan).`]);
  if(objects.some(o=>!o.hole && isOpenMesh(o))) items.push([false, 'Hay una pieza importada con errores (no es cerrada): no se pudo revisar y se exportará tal cual.']);
  const bad = items.filter(i=>!i[0]).length;
  openDlg(`<div class="step">Revisar antes de imprimir</div><h3>${bad ? `Hay ${bad} ${bad===1?'cosa':'cosas'} por revisar` : '¡Lista para imprimir!'}</h3>
    <ul class="checks">${items.map(([ok,t])=>`<li><span class="${ok?'ok':'warn'}">${ok?'✓':'⚠'}</span><span>${t}</span></li>`).join('')}</ul>
    <div class="row"><button class="btn" data-close>Cerrar</button><button class="btn primary" id="ck_stl">Exportar STL</button></div>`,
    card=>{ card.querySelector('#ck_stl').onclick = ()=>{ closeDlg(); exportStl(); }; });
}

function wireTools(p){

addEventListener('keydown', e=>{
  const modZ = (e.ctrlKey||e.metaKey) && ['z','y'].includes(e.key.toLowerCase());
  // en un cuadro de medida sin cambios, Ctrl+Z / Ctrl+Y deshacen en el diseño (no solo en el cuadro)
  if(modZ && e.target.matches('input[type=number],input[type=text]') && e.target.value === e.target.defaultValue && $('#guide').hidden && $('#dlg').hidden){
    e.preventDefault(); e.target.blur(); (e.key.toLowerCase()==='y' || e.shiftKey) ? redo() : undo(); return; }
  if(e.target.matches('input,select,textarea') || !$('#guide').hidden || !$('#dlg').hidden) return;
  const mod = e.ctrlKey||e.metaKey, k = e.key.toLowerCase();
  if(mod && k==='z' && !e.shiftKey){ e.preventDefault(); undo(); return; }
  if(mod && (k==='y' || (k==='z'&&e.shiftKey))){ e.preventDefault(); redo(); return; }
  if(mod && k==='d'){ e.preventDefault(); dup(); return; }
  if(mod && k==='a'){ e.preventDefault(); selectAll(); return; }
  if(mod && k==='g'){ e.preventDefault(); e.shiftKey ? ungroup() : group(); return; }
  if(mod && k==='s'){ e.preventDefault(); saveProject(); return; }
  if(k==='delete'||k==='backspace'){ e.preventDefault(); del(); return; }
  if(k==='escape'){ selected=[]; setMulti(false); rebuild(); return; }
  if(!mod && k==='w') setMode('translate'); if(!mod && k==='e') setMode('rotate'); if(!mod && k==='r') setMode('scale');
  const step = +$('#snap').value || 1;
  const mv = {arrowleft:[-step,0,0],arrowright:[step,0,0],arrowup:[0,step,0],arrowdown:[0,-step,0],pageup:[0,0,step],pagedown:[0,0,-step]}[k];

  if(objects.some(o=>baseGeom(o).pending)){ toast('Espera un momento: todavía se está cargando la letra.'); return; }

  // los huecos que aún no están agrupados también se restan, así el STL queda igual a lo que se ve en pantalla

  const holes = objects.filter(o=>o.hole && !isOpenMesh(o));

  if(closed.length){
    let man = unionOf(closed);
    if(holes.length){ const h = unionOf(holes), r = man.subtract(h); man.delete(); h.delete(); man = r; }
    if(!man.isEmpty()){
      parts.push(manCoords(man));
      const comps = man.decompose(), mz = man.boundingBox().min[2];
      floatN = comps.filter(c=>c.boundingBox().min[2] > mz + 0.05).length; comps.forEach(c=>c.delete());

  if(holes.length) msgs.push('Los huecos se restaron de la pieza exportada.');
  if(open.length) msgs.push('La pieza importada con errores se exportó tal cual, sin unir ni restar huecos.');
  if(floatN) msgs.unshift(`Ojo: ${floatN} ${floatN===1?'parte queda flotando':'partes quedan flotando'} en el aire. Usa "Revisar antes de imprimir".`);
  if(tooBig) msgs.unshift('Ojo: la pieza es más grande que tu impresora.');

let anim = null;
function flyTo(pos, target, instant){
  if(instant){ anim = null; camera.position.copy(pos); orbit.target.copy(target); orbit.update(); return; }
  const d0 = camera.position.clone().sub(orbit.target), d1 = pos.clone().sub(target);
  anim = {t0: orbit.target.clone(), t1: target.clone(), r0: d0.length(), r1: d1.length(),
    q: new THREE.Quaternion().setFromUnitVectors(d0.clone().normalize(), d1.clone().normalize()), n0: d0.normalize(), start: performance.now()};
}
function stepAnim(){
  if(!anim) return;

  const q = new THREE.Quaternion().slerp(anim.q, e);

  camera.position.copy(anim.n0).applyQuaternion(q).multiplyScalar(anim.r0 + (anim.r1-anim.r0)*e).add(orbit.target);

function sceneBox(onlySel){

  const c = document.createElement('canvas'); c.width = c.height = 128; const g = c.getContext('2d');
  g.fillStyle = hot ? css('--accent') : css('--panel'); g.fillRect(0,0,128,128);

/* ---------- Guía de bienvenida ---------- */
const GUIDE = [
  ['Bienvenido a Taller 3D', `<p>Aquí puedes diseñar piezas y descargarlas para imprimirlas en 3D. Todas las medidas están en <b>milímetros</b>.</p><p>Para mirar la mesa: <b>arrastra</b> con el mouse para girar la vista y usa la <b>rueda</b> para acercar o alejar.</p><p>El <b>cubo</b> de la esquina cambia la vista: haz clic en <b>FRENTE</b>, <b>ARRIBA</b>, en un borde o en una esquina. Con <b>⌂</b> vuelves a la vista general.</p>`],
  ['1. Agrega figuras', `<p>Haz clic en una figura de la izquierda: <b>Caja</b>, <b>Cilindro</b>, <b>Estrella</b>, <b>Texto</b>…</p><p>Para moverla, arrastra las flechas de colores. Para cambiar su tamaño exacto, escribe los milímetros en el panel de la derecha.</p>`],
  ['2. Haz agujeros', `<p>Las figuras grises de <b>Huecos</b> quitan material.</p><ul><li>Pon el hueco dentro del sólido.</li><li>Pulsa <b>Unir todo en una pieza</b> (o <b>Agrupar</b>).</li></ul><p>Para centrar el agujero: pulsa <b>Elegir varias</b>, haz clic en las dos figuras y luego en <b>Centro X</b> y <b>Centro Y</b>.</p>`],
  ['3. Guarda e imprime', `<ul><li><b>Guardar</b>: crea un archivo para seguir otro día. Con <b>Abrir</b> lo recuperas.</li><li><b>Exportar STL</b>: descarga la pieza para el programa de la impresora (Cura, PrusaSlicer…).</li></ul><p>Si te equivocas, usa <b>Deshacer</b> (Ctrl+Z).</p>`],
  ['Atajos de teclado', `<ul><li><b>Supr</b>: eliminar · <b>Ctrl+D</b>: duplicar</li><li><b>Ctrl+Z</b> / <b>Ctrl+Y</b>: deshacer / rehacer</li><li><b>Ctrl+A</b>: elegir todo · <b>Esc</b>: soltar la selección</li><li><b>Ctrl+G</b>: agrupar · <b>Ctrl+S</b>: guardar</li><li><b>Flechas</b>: mover · <b>Re Pág / Av Pág</b>: subir y bajar</li><li><b>W</b>, <b>E</b>, <b>R</b>: mover, rotar, escalar</li><li><b>Shift</b> mientras escalas: ajuste fino (0,1 mm)</li></ul>`],
];
let gi = 0;
function showGuide(i){
  gi = Math.max(0, Math.min(GUIDE.length-1, i));
  const [t, html] = GUIDE[gi];
  $('#gBody').innerHTML = `<div class="step">${gi+1} de ${GUIDE.length}</div><h3 id="gTitle">${t}</h3>${html}`;
  $('#gDots').innerHTML = GUIDE.map((_,k)=>`<i class="${k===gi?'on':''}"></i>`).join('');
  $('#gPrev').hidden = gi===0;
  $('#gNext').textContent = gi===GUIDE.length-1 ? '¡A diseñar!' : 'Siguiente';
  $('#guide').hidden = false; $('#gNext').focus();
}
function closeGuide(){ $('#guide').hidden = true; try{ localStorage.setItem('taller3d-guia','1'); }catch(e){} }
$('#gNext').onclick = ()=> gi===GUIDE.length-1 ? closeGuide() : showGuide(gi+1);
$('#gPrev').onclick = ()=>showGuide(gi-1);
$('#gSkip').onclick = closeGuide;
$('#guide').addEventListener('click', e=>{ if(e.target.id==='guide') closeGuide(); });
$('#guide').addEventListener('keydown', e=>{ e.stopPropagation(); if(e.key==='Escape') closeGuide(); if(e.key==='ArrowRight') $('#gNext').click(); if(e.key==='ArrowLeft' && gi) showGuide(gi-1); });
$('#bHelp').onclick = ()=>showGuide(0);
let seen = false; try{ seen = localStorage.getItem('taller3d-guia')==='1'; }catch(e){}
if(!seen) showGuide(0);

renderer.setAnimationLoop(()=>{ if(anim) stepAnim(); else orbit.update(); renderer.render(scene,camera); updateDims(); renderCube(); });
orbit.addEventListener('start', ()=>{ anim = null; });   // si el alumno arrastra, se corta la animación
</script>
